<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>mock 弹窗</title>
<style>
 body{margin:0;font:13px/1.5 system-ui,"Microsoft YaHei",sans-serif}
 #catalog{padding:8px;background:#fafafa;border-bottom:1px solid #ddd}
 #catalog b{padding:3px 8px;border:1px solid #ccc;border-radius:3px;margin-right:6px;cursor:pointer;font-weight:400}
 #catalog b.active{background:#dbeafe;border-color:#1f6feb;color:#1f6feb;font-weight:600}
 #stage{padding:14px;color:#555;min-height:180px}
 .maskDiv{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:99}
 .popDiv{background:#fff;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.2);width:440px}
 .popDiv .popTitle{padding:14px 18px;font-size:15px;font-weight:600;border-bottom:1px solid #eee}
 .popDiv .popWord2{padding:16px 18px;margin:0;color:#444}
 .popDiv .popBottom{padding:10px 18px 16px;text-align:right}
 .popDiv .popBottom a{display:inline-block;margin-left:10px;padding:6px 14px;border-radius:16px;cursor:pointer;text-decoration:none}
 .jb_btn{background:#3f6ff5;color:#fff}
 .btnBlue{border:1px solid #b9cdf5;color:#3f6ff5}
 #jobFinishTip{display:none}
</style>
</head>
<body>
<div id="catalog">
  <b class="active" data-sec="1.1">1.1</b><b data-sec="1.2">1.2</b><b data-sec="1.3">1.3</b>
</div>
<div id="stage">当前小节：<span id="cur">1.1</span><br>视频已播完，超星在此拦截。</div>

<div class="maskDiv jobFinishTip">
  <div class="popDiv wid440 popMove">
    <div class="popTitle">提示</div>
    <p class="popWord2 fs16 colorIn jobLimitTip">当前章节还有任务点未完成，是否去完成？</p>
    <div class="popBottom">
      <a class="jb_btn jb_btn_92 fr fs14 nextChapter" id="popNext">下一节</a>
      <a class="btnBlue btn_92_cancel fr fs14 popMoveDele" id="popGo">去学习</a>
    </div>
  </div>
</div>

<div class="AlertCon02" id="jobFinishTip">
  <div class="con03">
    <p>当前章节还有任务点未完成，是否去完成？</p>
    <div class="marTop30">
      <a class="bluebtn02 prebutton nextChapter" id="tplNext">下一节</a>
      <a class="graybtn02 marleft10 nextbutton" id="tplGo">去学习</a>
    </div>
  </div>
</div>

<script>
  var log = [];
  window.__mockLog = log;
  window.__injectedAt = performance.now();
  function rec(what) { log.push(Math.round(performance.now() - window.__injectedAt) + 'ms:' + what); console.log('[mock-popup] ' + what); }
  function advance() {
    var items = Array.from(document.querySelectorAll('#catalog b'));
    for (var i = 0; i < items.length - 1; i++) {
      if (items[i].classList.contains('active')) { items[i + 1].click(); return true; }
    }
    rec('already-last'); return false;
  }
  document.querySelectorAll('#catalog b').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#catalog b').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      document.getElementById('cur').textContent = b.getAttribute('data-sec');
      rec('section-change:' + b.getAttribute('data-sec'));
    });
  });
  document.getElementById('popNext').addEventListener('click', function () {
    rec('POPUP_NEXT_CLICKED');
    var m = document.querySelector('.maskDiv'); if (m) m.remove();
    advance();
  });
  document.getElementById('popGo').addEventListener('click', function () { rec('POPUP_GO_CLICKED_BAD'); });
  document.getElementById('tplNext').addEventListener('click', function () { rec('TEMPLATE_NEXT_CLICKED_BAD'); });
  document.getElementById('tplGo').addEventListener('click', function () { rec('TEMPLATE_GO_CLICKED_BAD'); });
</script>
</body>
</html>
