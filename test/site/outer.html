<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>mock 课程页</title>
<style>
  body{margin:0;font:13px/1.4 system-ui,"Microsoft YaHei",sans-serif;display:flex;height:100vh}
  #catalog{width:320px;border-right:1px solid #ddd;overflow:auto;background:#fafafa}
  .zt-title{padding:10px 12px;font-weight:600;background:#eef3fa;border-bottom:1px solid #e3e8ef}
  ul{list-style:none;margin:0;padding:0}
  li.posCatalog_select{padding:9px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer}
  li.posCatalog_select:hover{background:#f0f6ff}
  li.posCatalog_select.active{background:#dbeafe;font-weight:600;border-left:3px solid #1f6feb}
  #right{flex:1;display:flex;flex-direction:column}
  #hint{padding:6px 10px;background:#fff8e1;font-size:12px;color:#795548}
  iframe{flex:1;border:0;width:100%}
</style>
</head>
<body>
<div id="catalog">
  <div class="zt-title">1 专题一 坚持党的领导</div>
  <ul class="catalog_list">
    <li class="posCatalog_select" data-id="1.1">1.1 课前学习</li>
    <li class="posCatalog_select active" data-id="1.2">1.2 课中学习</li>
    <li class="posCatalog_select" data-id="1.3">1.3 课后学习</li>
  </ul>
  <div class="zt-title">2 专题二 经济大省挑大梁</div>
  <ul class="catalog_list">
    <li class="posCatalog_select" data-id="2.1">2.1 课前学习</li>
    <li class="posCatalog_select" data-id="2.2">2.2 课中学习</li>
  </ul>
  <div class="zt-title">3 专题三 推进粤港澳大湾区建设</div>
  <ul class="catalog_list">
    <li class="posCatalog_select" data-id="3.1">3.1 课前学习</li>
    <li class="posCatalog_select" data-id="3.2">3.2 课中学习</li>
  </ul>
</div>
<div id="right">
  <div id="hint">当前小节：<span id="cur">1.2</span></div>
  <iframe id="contentFrame" src="section.html?sec=1.2"></iframe>
</div>
<script>
  const frame = document.getElementById('contentFrame');
  const cur = document.getElementById('cur');
  document.querySelectorAll('.posCatalog_select').forEach(li => {
    li.addEventListener('click', () => {
      document.querySelectorAll('.posCatalog_select').forEach(x => x.classList.remove('active'));
      li.classList.add('active');
      cur.textContent = li.dataset.id;
      frame.src = 'section.html?sec=' + li.dataset.id;
      console.log('[mock] 切换到小节', li.dataset.id);
    });
  });
</script>
</body>
</html>
