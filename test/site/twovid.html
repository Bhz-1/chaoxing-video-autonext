<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>两个视频</title>
<style>body{margin:0;font:12px system-ui;padding:8px}
video{width:240px;height:135px;background:#000;display:block;margin-bottom:6px}
#log{white-space:pre-wrap;color:#555;font-size:11px}</style></head>
<body>
<div id="log">准备中…</div>
<script>
var q = new URLSearchParams(location.search);
var logEl = document.getElementById('log');
var logs = [];
window.__plays = [];        // 记录每个视频的 play() 调用次数
window.__events = [];
function say(s){ logs.push(s); logEl.textContent = logs.join('\n'); console.log('[two-video] ' + s); }

function makeClip(seconds){
  return new Promise(function(resolve){
    var c=document.createElement('canvas'); c.width=240; c.height=135;
    var ctx=c.getContext('2d'); var stream=c.captureStream(20);
    var rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp8'});
    var chunks=[]; rec.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
    var done=new Promise(function(r){ rec.onstop=r; });
    rec.start(); var t0=performance.now();
    new Promise(function(res){ (function draw(){
      var t=(performance.now()-t0)/1000;
      ctx.fillStyle='hsl('+((t*100)%360)+',60%,45%)'; ctx.fillRect(0,0,240,135);
      ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; ctx.fillText('t='+t.toFixed(2),10,70);
      if(t<seconds) requestAnimationFrame(draw); else res();
    })(); }).then(function(){ rec.stop(); done.then(function(){ resolve(URL.createObjectURL(new Blob(chunks,{type:'video/webm'}))); }); });
  });
}
makeClip(2).then(function(url){
  for(var i=0;i<2;i++){
    var v=document.createElement('video');
    v.src=url; v.muted=true; v.playsInline=true;
    v.setAttribute('data-idx', String(i));
    (function(v, i){
      // 包装 play()，统计调用次数
      var orig = v.play.bind(v);
      window.__plays[i] = 0;
      v.play = function(){
        window.__plays[i]++;
        window.__events.push('play:' + i + ' (第' + window.__plays[i] + '次)');
        console.log('[two-video] play() 调用 视频' + i + ' 第' + window.__plays[i] + '次');
        return orig();
      };
      v.addEventListener('playing', function(){ say('视频' + i + ' 开始播放'); });
      v.addEventListener('ended', function(){ say('视频' + i + ' 播放结束'); });
    })(v, i);
    document.body.appendChild(v);
  }
  say('两个视频已就绪，开始播第 0 个');
  document.querySelectorAll('video')[0].play().catch(function(e){ say('失败:'+e.name); });
});
</script>
</body></html>
